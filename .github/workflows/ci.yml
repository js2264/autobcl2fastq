name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git for private packages
        run: git config --global url."https://${{ secrets.RSG_PACKAGES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install project
        run: uv sync --extra dev --frozen

      - name: ruff format
        run: uv run ruff format --check --diff .

      - name: ruff
        run: uv run ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git for private packages
        run: git config --global url."https://${{ secrets.RSG_PACKAGES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install package and dev dependencies
        run: uv sync --extra dev --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=autobcl2fastq --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Configure git for private packages
        run: git config --global url."https://${{ secrets.RSG_PACKAGES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Build distribution
        run: uv build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
